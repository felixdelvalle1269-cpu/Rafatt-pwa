<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafatt Seguridad - PWA Operativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="min-h-screen flex flex-col">
        <!-- Encabezado -->
        <header class="bg-slate-900 text-white shadow-md p-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Rafatt Seguridad</h1>
                <p class="text-xs text-gray-400">RIF: J-407284576</p>
            </div>
            <span class="bg-green-600 text-xs px-2.5 py-1 rounded-full font-semibold">Sistema Activo</span>
        </header>

        <!-- Contenido Principal -->
        <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-6">
            <!-- Panel de Control -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-gray-500 text-sm font-medium">Personal en Turno</h3>
                    <p class="text-2xl font-bold text-slate-800 mt-1">12</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-gray-500 text-sm font-medium">Incidentes Hoy</h3>
                    <p class="text-2xl font-bold text-slate-800 mt-1">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-gray-500 text-sm font-medium">Estado de Red</h3>
                    <p class="text-2xl font-bold text-green-600 mt-1">Sincronizado</p>
                </div>
            </section>

            <!-- Sección de Bitácora / Directorio -->
            <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4">Bitácora Operativa</h2>
                <div class="border-2 border-dashed border-gray-200 rounded-lg p-6 text-center text-gray-500">
                    <p class="mb-2">El sistema operativo está conectado a GitHub y Netlify.</p>
                    <span class="text-xs bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-medium">PWA Configurada</span>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
